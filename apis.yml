name: JAKA
description: 'JAKA (Shanghai JAKA Robotics Co., Ltd.) is a collaborative robot (cobot) manufacturer
  founded in 2014 and headquartered in Shanghai, China, with origins in robotics research at Shanghai
  University. The company designs and builds lightweight, human-collaborative industrial robot arms —
  including its JAKA Zu series and MiniCobo — used across manufacturing, 3C electronics, automotive,
  healthcare, education, and commercial service applications. JAKA robots are programmed through the
  company''s on-device control software and a robot SDK (C++/Python) that communicates with the robot
  controller over TCP/IP on the local network, rather than a public cloud web API. As of this profile
  JAKA does not publish a public developer portal, OpenAPI definition, or hosted REST/MCP API surface;
  this repository is a company profile in the API Evangelist network.'
